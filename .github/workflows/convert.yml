name: convert-kmodel
on:
  workflow_dispatch:   # 手动触发
  push:                # 也可在推送后自动触发

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install nncase
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dotnet-sdk-7.0
          pip install -q nncase==2.9.0 nncase-kpu==2.9.0 onnx==1.15.0
      - name: Convert
        run: python convert_kmodel.py
      - name: Upload kmodel
        uses: actions/upload-artifact@v4
        with:
          name: color_yolov8n
          path: color_yolov8n.kmodel
